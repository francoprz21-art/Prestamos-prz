<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRESTAMOS - Elite v12.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #060a0f; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .card-prz { background: #111827; border: 1px solid #1f2937; border-radius: 12px; }
        .input-prz { background: #1f2937 !important; border: 1px solid #374151 !important; color: white !important; border-radius: 8px; padding: 12px; width: 100%; }
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; font-weight: bold; border-radius: 8px; }
        .cuota-card { background: #ffffff; color: #1e293b; border-radius: 8px; margin-bottom: 10px; border-left: 6px solid #cbd5e1; }
        .cuota-pagada { border-left-color: #10b981 !important; background: #f0fdf4; }
        .cuota-pendiente { border-left-color: #f59e0b !important; background: #fffbeb; }
        .cuota-vencida { border-left-color: #ef4444 !important; background: #fef2f2; }
    </style>
</head>
<body class="p-4 pb-24">

    <div class="max-w-md mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-black italic text-white uppercase tracking-tighter">PRZ <span class="text-emerald-500">PRESTAMOS</span></h1>
        </header>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="card-prz p-4 border-t-4 border-t-blue-500 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold">Invertido</p>
                <p id="totalCapital" class="text-lg font-bold text-white">$0</p>
            </div>
            <div class="card-prz p-4 border-t-4 border-t-emerald-500 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold">A Cobrar</p>
                <p id="totalDeuda" class="text-lg font-bold text-emerald-500">$0</p>
            </div>
        </div>

        <div class="card-prz p-5 mb-6">
            <div class="space-y-4">
                <input type="text" id="nombreCliente" placeholder="CLIENTE" class="input-prz uppercase font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="montoInput" oninput="formatearMoneda(this)" placeholder="Monto" class="input-prz text-emerald-500 font-bold">
                    <input type="number" id="tasaInteres" placeholder="Interés %" class="input-prz">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="cuotas" placeholder="Cuotas" class="input-prz">
                    <select id="frecuencia" class="input-prz font-bold text-xs">
                        <option value="1">DIARIO</option>
                        <option value="7">SEMANAL</option>
                        <option value="15">QUINCENAL</option>
                        <option value="30">MENSUAL</option>
                    </select>
                </div>
                <input type="date" id="fechaInicioManual" class="input-prz text-xs">
                <button onclick="crearPrestamo()" class="btn-emerald w-full py-4 uppercase text-sm shadow-xl">Activar Crédito</button>
            </div>
        </div>

        <div id="listaClientes" class="space-y-4"></div>
    </div>

    <div id="modalEdit" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50">
        <div class="card-prz p-6 w-full max-w-sm">
            <h3 class="text-white font-bold mb-4 uppercase text-center">Modificar Préstamo</h3>
            <input type="hidden" id="editId">
            <div class="space-y-3">
                <input type="text" id="editNombre" class="input-prz uppercase">
                <input type="text" id="editMonto" oninput="formatearMoneda(this)" class="input-prz">
                <input type="number" id="editTasa" class="input-prz" placeholder="Tasa %">
                <input type="number" id="editCuotas" class="input-prz" placeholder="Cuotas">
                <input type="date" id="editFecha" class="input-prz">
                <div class="flex gap-2 pt-2">
                    <button onclick="cerrarModal()" class="flex-1 bg-slate-800 py-3 rounded-lg font-bold">CANCELAR</button>
                    <button onclick="guardarEdicion()" class="flex-1 btn-emerald py-3 rounded-lg">GUARDAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('prz_v12_db')) || [];
        document.getElementById('fechaInicioManual').valueAsDate = new Date();

        function formatearMoneda(input) {
            let valor = input.value.replace(/\D/g, "");
            valor = new Intl.NumberFormat('es-AR').format(valor);
            input.value = valor === "0" ? "" : valor;
        }

        function limpiarPuntos(str) {
            return parseFloat(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0;
        }

        function guardar() {
            localStorage.setItem('prz_v12_db', JSON.stringify(clientes));
            renderizar();
        }

        function generarPlan(nombre, monto, tasa, numCuotas, frec, fInicio, idOld = null) {
            const total = monto + (monto * (tasa / 100));
            const valorC = total / numCuotas;
            let plan = [];
            for(let i=1; i<=numCuotas; i++) {
                let fV = new Date(fInicio);
                fV.setDate(fInicio.getDate() + (i * frec));
                plan.push({ num: i, venc: fV.toISOString(), total: valorC, pagado: 0 });
            }
            return { id: idOld || Date.now(), nombre: nombre.toUpperCase(), monto, tasa, frec, plan, fechaInicio: fInicio.toISOString() };
        }

        function crearPrestamo() {
            const n = document.getElementById('nombreCliente').value;
            const m = limpiarPuntos(document.getElementById('montoInput').value);
            const t = parseFloat(document.getElementById('tasaInteres').value) || 0;
            const c = parseInt(document.getElementById('cuotas').value) || 1;
            const f = parseInt(document.getElementById('frecuencia').value);
            const fi = new Date(document.getElementById('fechaInicioManual').value + "T00:00:00");
            if(!n || m <= 0) return alert("Faltan datos");
            clientes.push(generarPlan(n, m, t, c, f, fi));
            guardar();
        }

        function abrirModal(id) {
            const c = clientes.find(x => x.id === id);
            document.getElementById('editId').value = c.id;
            document.getElementById('editNombre').value = c.nombre;
            document.getElementById('editMonto').value = c.monto.toLocaleString('es-AR');
            document.getElementById('editTasa').value = c.tasa;
            document.getElementById('editCuotas').value = c.plan.length;
            document.getElementById('editFecha').value = c.fechaInicio.split('T')[0];
            document.getElementById('modalEdit').classList.remove('hidden');
        }

        function guardarEdicion() {
            const id = parseInt(document.getElementById('editId').value);
            const idx = clientes.findIndex(x => x.id === id);
            const n = document.getElementById('editNombre').value;
            const m = limpiarPuntos(document.getElementById('editMonto').value);
            const t = parseFloat(document.getElementById('editTasa').value);
            const c = parseInt(document.getElementById('editCuotas').value);
            const fi = new Date(document.getElementById('editFecha').value + "T00:00:00");
            clientes[idx] = generarPlan(n, m, t, c, clientes[idx].frec, fi, id);
            guardar();
            cerrarModal();
        }

        function registrarPago(id) {
            const abono = parseFloat(prompt("Monto a cobrar:"));
            if(!abono || abono <= 0) return;
            let rem = abono;
            const c = clientes.find(x => x.id === id);
            c.plan.forEach(ct => {
                if(rem <= 0) return;
                let deuda = ct.total - ct.pagado;
                if(deuda > 0.01) {
                    if(rem >= deuda) { ct.pagado = ct.total; rem -= deuda; }
                    else { ct.pagado += rem; rem = 0; }
                }
            });
            guardar();
            window.open(`https://wa.me/?text=*RECIBO PRZ*%0A*Cliente:* ${c.nombre}%0A*Abonó:* $${abono.toLocaleString('es-AR')}`, '_blank');
        }

        function enviarWA(nom, cuota, pagado) {
            window.open(`https://wa.me/?text=*COMPROBANTE PRZ*%0A*Cliente:* ${nom}%0A*Cuota:* ${cuota}%0A*Pagado:* $${pagado.toLocaleString('es-AR')}`, '_blank');
        }

        function renderizar() {
            const lista = document.getElementById('listaClientes');
            lista.innerHTML = '';
            let capG = 0, deuG = 0, hoy = new Date();
            clientes.forEach(c => {
                capG += c.monto;
                let pendienteC = 0;
                const cuotasHTML = c.plan.map(ct => {
                    let deuda = ct.total - ct.pagado;
                    pendienteC += deuda;
                    let fV = new Date(ct.venc);
                    let clase = ct.pagado >= (ct.total - 0.1) ? "cuota-pagada" : (hoy > fV ? "cuota-vencida" : (ct.pagado > 0 ? "cuota-pendiente" : ""));
                    return `<div class="cuota-card p-3 ${clase} flex justify-between items-center shadow-sm">
                        <div class="text-[10px]"><b>Cuota ${ct.num}</b><br>${fV.toLocaleDateString('es-AR')}<br>Total: $${ct.total.toLocaleString('es-AR')}</div>
                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <p class="text-[10px] font-black text-emerald-600">$${ct.pagado.toLocaleString('es-AR')}</p>
                                ${deuda > 0.1 && ct.pagado > 0 ? `<p class="text-[8px] text-red-600 font-bold italic">FALTA: $${deuda.toLocaleString('es-AR')}</p>` : ''}
                            </div>
                            ${ct.pagado > 0 ? `<button onclick="enviarWA('${c.nombre}', ${ct.num}, ${ct.pagado})" class="text-emerald-500 text-lg"><i class="fab fa-whatsapp"></i></button>` : ''}
                        </div>
                    </div>`;
                }).join('');
                deuG += pendienteC;
                const div = document.createElement('div');
                div.className = 'card-prz mb-4 p-4';
                div.innerHTML = `<div class="flex justify-between items-center mb-2">
                    <div onclick="document.getElementById('p-${c.id}').classList.toggle('hidden')" class="cursor-pointer">
                        <h3 class="font-black text-sm uppercase">${c.nombre}</h3>
                        <p class="text-[10px] text-emerald-500 font-bold">$${pendienteC.toLocaleString('es-AR')} RESTANTE</p>
                    </div>
                    <div class="flex gap-4 text-slate-500">
                        <button onclick="abrirModal(${c.id})"><i class="fas fa-edit"></i></button>
                        <button onclick="eliminar(${c.id})"><i class="fas fa-trash-alt text-red-900"></i></button>
                    </div>
                </div>
                <div id="p-${c.id}" class="hidden mt-3 border-t border-slate-800 pt-3">
                    <button onclick="registrarPago(${c.id})" class="btn-emerald w-full py-2 text-xs mb-3">COBRAR</button>
                    ${cuotasHTML}
                </div>`;
                lista.appendChild(div);
            });
            document.getElementById('totalCapital').innerText = `$${capG.toLocaleString('es-AR')}`;
            document.getElementById('totalDeuda').innerText = `$${deuG.toLocaleString('es-AR')}`;
        }

        function eliminar(id) { if(confirm("¿Borrar?")) { clientes = clientes.filter(x => x.id !== id); guardar(); } }
        function cerrarModal() { document.getElementById('modalEdit').classList.add('hidden'); }
        renderizar();
    </script>
</body>
</html>
