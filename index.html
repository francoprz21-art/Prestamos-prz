<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRÉSTAMOS</title>
    <style>
        :root { --primary: #0a2e29; --secondary: #164a41; --accent: #4caf50; --text: #e0e0e0; --card-bg: #ffffff10; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary); color: var(--text); margin: 0; padding-bottom: 70px; }
        .header { background: linear-gradient(to bottom, #10403a, var(--primary)); padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .container { padding: 15px; }
        .card-prestamo { background: var(--card-bg); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #ffffff20; }
        .cuota-item { background: white; color: #333; margin-bottom: 10px; border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .nro-cuota { background: #ddd; border-radius: 50%; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 10px; font-weight: bold; }
        .tab-menu { display: flex; background: var(--secondary); border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; cursor: pointer; }
        .tab.active { background: var(--accent); color: white; font-weight: bold; }
        .btn-float { position: fixed; bottom: 85px; right: 20px; background: var(--accent); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: none; font-size: 30px; color: white; cursor: pointer; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: #051a17; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #ffffff10; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; background: #ffffff20; color: white; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; padding: 20px; box-sizing: border-box; z-index: 100; }
    </style>
</head>
<body>

<div id="app">
    <div id="view-cartera">
        <div class="header">
            <h2>PRZ PRÉSTAMOS</h2>
            <p>Organiza tus cobros</p>
        </div>
        <div class="container" id="lista-clientes"></div>
    </div>

    <div id="view-detalle" style="display:none;">
        <div class="header">
            <button onclick="changeView('view-cartera')" style="float:left; background:none; border:none; color:white;">←</button>
            <h2 id="det-nombre">Nombre</h2>
            <p id="det-total">Total: $0</p>
        </div>
        <div class="container">
            <div class="tab-menu">
                <div class="tab active">Plan de pago</div>
                <div class="tab">Historial</div>
            </div>
            <div id="lista-cuotas"></div>
        </div>
        <button class="btn-float" onclick="abrirModalPago()">💵</button>
    </div>

    <div id="modal-nuevo" class="modal">
        <h3>Crear Préstamo</h3>
        <input type="text" id="n-cliente" placeholder="Nombre del cliente">
        <input type="number" id="n-valor" placeholder="Valor del crédito">
        <input type="number" id="n-cuotas" placeholder="Cantidad de cuotas">
        <input type="number" id="n-interes" placeholder="Interés %">
        <button class="btn-float" style="bottom:20px" onclick="guardarPrestamo()">✅</button>
        <button onclick="cerrarModal('modal-nuevo')" style="background:none; border:none; color:gray; width:100%; margin-top:20px;">Cancelar</button>
    </div>

    <div id="modal-pago" class="modal">
        <h3>Registrar Abono</h3>
        <p id="pago-info-cuota">Valor cuota: $0</p>
        <input type="number" id="pago-monto" placeholder="Monto a cobrar">
        <button class="btn-float" style="bottom:20px" onclick="procesarAbono()">💾</button>
        <button onclick="cerrarModal('modal-pago')" style="background:none; border:none; color:gray; width:100%; margin-top:20px;">Cancelar</button>
    </div>

    <div class="nav-bottom">
        <div onclick="changeView('view-cartera')">🏠</div>
        <div onclick="abrirModalNuevo()">➕</div>
        <div>⚙️</div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('prz_db')) || [];
    let curIdx = null;

    function changeView(id) {
        document.getElementById('view-cartera').style.display = 'none';
        document.getElementById('view-detalle').style.display = 'none';
        document.getElementById(id).style.display = 'block';
        if(id === 'view-cartera') renderCartera();
    }

    function abrirModalNuevo() { document.getElementById('modal-nuevo').style.display = 'block'; }
    function abrirModalPago() { document.getElementById('modal-pago').style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

    function guardarPrestamo() {
        const nombre = document.getElementById('n-cliente').value;
        const valor = parseFloat(document.getElementById('n-valor').value);
        const nCuotas = parseInt(document.getElementById('n-cuotas').value);
        const int = parseFloat(document.getElementById('n-interes').value);

        if(!nombre || !valor) return;

        const total = valor + (valor * (int/100));
        const cuotaVal = total / nCuotas;

        db.push({
            nombre, valor, nCuotas, total, cuotaVal,
            saldo: total,
            pagado: 0
        });

        localStorage.setItem('prz_db', JSON.stringify(db));
        cerrarModal('modal-nuevo');
        renderCartera();
    }

    function renderCartera() {
        const cont = document.getElementById('lista-clientes');
        cont.innerHTML = '';
        db.forEach((p, i) => {
            cont.innerHTML += `
                <div class="card-prestamo" onclick="verDetalle(${i})">
                    <div style="display:flex; justify-content:space-between">
                        <strong>${p.nombre.toUpperCase()}</strong>
                        <span style="color:var(--accent)">$${p.saldo.toLocaleString()}</span>
                    </div>
                    <small style="color:var(--gray)">${p.nCuotas} cuotas de $${p.cuotaVal.toLocaleString()}</small>
                </div>`;
        });
    }

    function verDetalle(i) {
        curIdx = i;
        const p = db[i];
        document.getElementById('det-nombre').innerText = p.nombre;
        document.getElementById('det-total').innerText = `Saldo: $${p.saldo.toLocaleString()} / Total: $${p.total.toLocaleString()}`;
        document.getElementById('pago-info-cuota').innerText = `Monto cuota: $${p.cuotaVal.toLocaleString()}`;
        
        const listC = document.getElementById('lista-cuotas');
        listC.innerHTML = '';
        for(let n=1; n<=p.nCuotas; n++) {
            listC.innerHTML += `
                <div class="cuota-item">
                    <div style="display:flex; align-items:center;">
                        <div class="nro-cuota">${n}</div>
                        <div>
                            <div style="font-size:14px">Saldo cuota</div>
                            <div style="font-size:12px; color:gray">Vence próximamente</div>
                        </div>
                    </div>
                    <strong>$${p.cuotaVal.toLocaleString()}</strong>
                </div>`;
        }
        changeView('view-detalle');
    }

    function procesarAbono() {
        const monto = parseFloat(document.getElementById('pago-monto').value);
        if(!monto) return;
        
        db[curIdx].saldo -= monto;
        db[curIdx].pagado += monto;
        
        localStorage.setItem('prz_db', JSON.stringify(db));
        cerrarModal('modal-pago');
        verDetalle(curIdx);
    }

    renderCartera();
</script>
</body>
</html>
