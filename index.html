<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRESTAMOS - Pro+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #060a0f; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .card-prz { background: #111827; border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; }
        .input-prz { 
            background: #1f2937; border: 1px solid #374151; color: white; 
            border-radius: 8px; padding: 10px; width: 100%;
        }
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; font-weight: bold; border-radius: 8px; }
        .text-emerald { color: #10b981; }
        
        /* ESTADOS DE CUOTA */
        .cuota-pagada { border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.05); }
        .cuota-pendiente { border-left: 4px solid #f59e0b; background: rgba(245, 158, 11, 0.05); }
        .cuota-vencida { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.05); }
        .cuota-futura { border-left: 4px solid #374151; opacity: 0.6; }
    </style>
</head>
<body class="p-4 pb-24">

    <div class="max-w-md mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-black tracking-widest text-white">PRZ <span class="text-emerald">PRESTAMOS</span></h1>
        </header>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="card-prz p-4 border-t-4 border-t-emerald-500 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold">Capital Activo</p>
                <p id="totalCapital" class="text-lg font-bold text-white">$0</p>
            </div>
            <div class="card-prz p-4 border-t-4 border-t-emerald-500 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold">Saldo Total</p>
                <p id="totalDeuda" class="text-lg font-bold text-emerald">$0</p>
            </div>
        </div>

        <div class="card-prz p-5 mb-6 border-emerald-900/30">
            <div class="space-y-3">
                <input type="text" id="nombreCliente" placeholder="Nombre del Cliente" class="input-prz uppercase">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="montoInput" oninput="formatearMoneda(this)" placeholder="Monto" class="input-prz text-emerald font-bold">
                    <input type="number" id="tasaInteres" placeholder="Interés %" class="input-prz">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="cuotas" placeholder="Cant. Cuotas" class="input-prz">
                    <select id="frecuencia" class="input-prz">
                        <option value="1">Diario</option>
                        <option value="7">Semanal</option>
                        <option value="15">Quincenal</option>
                        <option value="30">Mensual</option>
                    </select>
                </div>
                <button onclick="crearPrestamo()" class="btn-emerald w-full py-3 shadow-lg">CREAR PRÉSTAMO</button>
            </div>
        </div>

        <div id="listaClientes" class="space-y-4"></div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('prz_v3_data')) || [];

        function formatearMoneda(input) {
            let valor = input.value.replace(/\D/g, "");
            valor = new Intl.NumberFormat('es-AR').format(valor);
            input.value = valor === "0" ? "" : valor;
        }

        function limpiarPuntos(str) {
            return parseFloat(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0;
        }

        function guardar() {
            localStorage.setItem('prz_v3_data', JSON.stringify(clientes));
            renderizar();
        }

        function crearPrestamo() {
            const nombre = document.getElementById('nombreCliente').value;
            const monto = limpiarPuntos(document.getElementById('montoInput').value);
            const interes = parseFloat(document.getElementById('tasaInteres').value) || 0;
            const numCuotas = parseInt(document.getElementById('cuotas').value) || 1;
            const diasFrecuencia = parseInt(document.getElementById('frecuencia').value);

            if(!nombre || monto <= 0) return alert("Carga nombre y monto");

            const totalCobrar = monto + (monto * (interes / 100));
            const valorCuota = totalCobrar / numCuotas;
            const hoy = new Date();

            let cronograma = [];
            for(let i = 1; i <= numCuotas; i++) {
                let fVenc = new Date();
                fVenc.setDate(hoy.getDate() + (i * diasFrecuencia));
                cronograma.push({
                    numero: i,
                    fechaVenc: fVenc.toISOString(),
                    montoTotal: valorCuota,
                    montoPagado: 0,
                    estado: 'pendiente' // pendiente, pagada
                });
            }

            clientes.push({
                id: Date.now(),
                nombre: nombre.toUpperCase(),
                montoInicial: monto,
                totalCobrar: totalCobrar,
                cuotas: cronograma,
                fechaCreacion: hoy.toISOString()
            });

            guardar();
            document.getElementById('nombreCliente').value = '';
            document.getElementById('montoInput').value = '';
        }

        function abonarCuota(clienteId) {
            const index = clientes.findIndex(c => c.id === clienteId);
            const montoAbonado = parseFloat(prompt("Ingrese el monto a abonar:"));
            
            if(isNaN(montoAbonado) || montoAbonado <= 0) return;

            let remanente = montoAbonado;
            let cliente = clientes[index];

            for(let cuota of cliente.cuotas) {
                if(remanente <= 0) break;
                if(cuota.montoPagado < cuota.montoTotal) {
                    const faltaParaCompletar = cuota.montoTotal - cuota.montoPagado;
                    if(remanente >= faltaParaCompletar) {
                        remanente -= faltaParaCompletar;
                        cuota.montoPagado = cuota.montoTotal;
                        cuota.estado = 'pagada';
                    } else {
                        cuota.montoPagado += remanente;
                        remanente = 0;
                        cuota.estado = 'pendiente';
                    }
                }
            }
            
            guardar();
            alert(`Pago registrado. Recibo enviado por WhatsApp.`);
            const msg = `*COMPROBANTE DE PAGO*%0A*EMPRESA:* PRZ PRESTAMOS%0A*CLIENTE:* ${cliente.nombre}%0A*ABONÓ:* $${montoAbonado.toLocaleString('es-AR')}%0A--------------------------`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        function toggleDesglose(id) {
            const el = document.getElementById(`desglose-${id}`);
            el.classList.toggle('hidden');
        }

        function renderizar() {
            const lista = document.getElementById('listaClientes');
            lista.innerHTML = '';
            let cap = 0; let deuTotal = 0;
            const hoy = new Date();

            clientes.forEach(c => {
                cap += c.montoInicial;
                let saldoC = 0;
                
                const cuotasHTML = c.cuotas.map(ct => {
                    const fV = new Date(ct.fechaVenc);
                    const vencida = hoy > fV && ct.estado !== 'pagada';
                    saldoC += (ct.montoTotal - ct.montoPagado);
                    
                    let claseEstado = 'cuota-futura';
                    if(ct.estado === 'pagada') claseEstado = 'cuota-pagada';
                    else if(vencida) claseEstado = 'cuota-vencida';
                    else if(ct.montoPagado > 0) claseEstado = 'cuota-pendiente';

                    return `
                        <div class="p-3 mb-2 rounded-lg text-xs flex justify-between items-center ${claseEstado}">
                            <div>
                                <p class="font-bold">Cuota ${ct.numero}</p>
                                <p class="text-slate-500">${fV.toLocaleDateString('es-AR')}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-bold">$${ct.montoTotal.toLocaleString('es-AR')}</p>
                                <p class="${ct.montoPagado > 0 ? 'text-emerald' : 'text-slate-500'}">Pago: $${ct.montoPagado.toLocaleString('es-AR')}</p>
                            </div>
                        </div>
                    `;
                }).join('');

                deuTotal += saldoC;

                const card = document.createElement('div');
                card.className = 'card-prz';
                card.innerHTML = `
                    <div class="p-4 flex justify-between items-center cursor-pointer" onclick="toggleDesglose(${c.id})">
                        <div>
                            <h3 class="font-black text-white text-sm">${c.nombre}</h3>
                            <p class="text-[9px] text-slate-500 uppercase">Saldo: $${saldoC.toLocaleString('es-AR')}</p>
                        </div>
                        <i class="fas fa-chevron-down text-slate-600 text-xs"></i>
                    </div>
                    <div id="desglose-${c.id}" class="hidden p-4 border-t border-slate-800 bg-slate-900/30">
                        <button onclick="abonarCuota(${c.id})" class="btn-emerald w-full py-2 text-xs mb-4">REGISTRAR ABONO</button>
                        <div class="max-h-60 overflow-y-auto pr-2">
                            ${cuotasHTML}
                        </div>
                        <button onclick="eliminar(${c.id})" class="w-full mt-4 text-[9px] text-red-900 font-bold uppercase">Eliminar Préstamo</button>
                    </div>
                `;
                lista.appendChild(card);
            });

            document.getElementById('totalCapital').innerText = `$${cap.toLocaleString('es-AR')}`;
            document.getElementById('totalDeuda').innerText = `$${deuTotal.toLocaleString('es-AR')}`;
        }

        function eliminar(id) { if(confirm("¿Eliminar préstamo?")) { clientes = clientes.filter(c => c.id !== id); guardar(); } }
        renderizar();
    </script>
</body>
</html>
