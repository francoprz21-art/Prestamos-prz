<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRESTAMOS - Elite v7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #060a0f; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .card-prz { background: #111827; border: 1px solid #1f2937; border-radius: 12px; }
        .input-prz { 
            background: #1f2937; border: 1px solid #374151; color: white; 
            border-radius: 8px; padding: 10px; width: 100%;
        }
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; font-weight: bold; border-radius: 8px; }
        
        .cuota-card { 
            background: #ffffff; color: #1e293b; border-radius: 8px; 
            margin-bottom: 8px; border-left: 6px solid #cbd5e1; 
        }
        .cuota-pagada { border-left-color: #10b981 !important; background: #f0fdf4; }
        .cuota-pendiente { border-left-color: #f59e0b !important; background: #fffbeb; }
        .cuota-vencida { border-left-color: #ef4444 !important; background: #fef2f2; }
        
        .text-emerald { color: #10b981; }
    </style>
</head>
<body class="p-4 pb-24">

    <div class="max-w-md mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-black tracking-widest text-white italic">PRZ <span class="text-emerald">PRESTAMOS</span></h1>
        </header>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="card-prz p-4 border-t-4 border-t-blue-500 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold">Capital Invertido</p>
                <p id="totalCapital" class="text-lg font-bold text-white">$0</p>
            </div>
            <div class="card-prz p-4 border-t-4 border-t-emerald-500 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold">Cartera con Ganancia</p>
                <p id="totalDeuda" class="text-lg font-bold text-emerald">$0</p>
            </div>
        </div>

        <div class="card-prz p-5 mb-6 border-emerald-900/30">
            <div class="space-y-3">
                <input type="text" id="nombreCliente" placeholder="NOMBRE DEL CLIENTE" class="input-prz uppercase font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="montoInput" oninput="formatearMoneda(this)" placeholder="Monto Préstamo" class="input-prz text-emerald font-bold">
                    <input type="number" id="tasaInteres" placeholder="Interés %" class="input-prz">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="cuotas" placeholder="Cantidad Cuotas" class="input-prz">
                    <select id="frecuencia" class="input-prz">
                        <option value="1">Diario</option>
                        <option value="7">Semanal</option>
                        <option value="15">Quincenal</option>
                        <option value="30">Mensual</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase ml-1">Fecha de Inicio</label>
                    <input type="date" id="fechaInicioManual" class="input-prz">
                </div>
                <button onclick="crearPrestamo()" class="btn-emerald w-full py-3 shadow-lg">ACTIVAR CRÉDITO</button>
            </div>
        </div>

        <div id="listaClientes" class="space-y-4"></div>
    </div>

    <div id="modalEdit" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
        <div class="card-prz p-6 w-full max-w-sm border-emerald-500/50">
            <h2 class="text-white font-bold mb-4 uppercase text-sm">Editar Cliente</h2>
            <input type="hidden" id="editId">
            <label class="text-[10px] text-slate-500 uppercase">Nombre</label>
            <input type="text" id="editNombre" class="input-prz mb-3 uppercase">
            <div class="flex gap-2">
                <button onclick="cerrarModal()" class="flex-1 bg-slate-800 py-2 rounded-lg font-bold">Cancelar</button>
                <button onclick="guardarEdicion()" class="flex-1 btn-emerald py-2 rounded-lg">Guardar</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-5 right-5 flex flex-col gap-3">
        <button onclick="exportarDatos()" class="bg-slate-800 p-4 rounded-full text-emerald shadow-xl border border-emerald-900/50"><i class="fas fa-download"></i></button>
        <button onclick="document.getElementById('importInput').click()" class="bg-slate-800 p-4 rounded-full text-slate-500 border border-slate-700"><i class="fas fa-upload"></i></button>
        <input type="file" id="importInput" class="hidden" onchange="importarDatos(event)">
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('prz_v7_final')) || [];
        
        // Poner fecha de hoy por defecto en el input manual
        document.getElementById('fechaInicioManual').valueAsDate = new Date();

        function formatearMoneda(input) {
            let valor = input.value.replace(/\D/g, "");
            valor = new Intl.NumberFormat('es-AR').format(valor);
            input.value = valor === "0" ? "" : valor;
        }

        function limpiarPuntos(str) {
            return parseFloat(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0;
        }

        function guardar() {
            localStorage.setItem('prz_v7_final', JSON.stringify(clientes));
            renderizar();
        }

        function crearPrestamo() {
            const nombre = document.getElementById('nombreCliente').value;
            const monto = limpiarPuntos(document.getElementById('montoInput').value);
            const interesPorc = parseFloat(document.getElementById('tasaInteres').value) || 0;
            const numCuotas = parseInt(document.getElementById('cuotas').value) || 1;
            const diasFrecuencia = parseInt(document.getElementById('frecuencia').value);
            const fManual = new Date(document.getElementById('fechaInicioManual').value);
            
            // Ajustar zona horaria
            fManual.setMinutes(fManual.getMinutes() + fManual.getTimezoneOffset());

            if(!nombre || monto <= 0) return alert("Carga nombre y monto");

            const totalCobrar = monto + (monto * (interesPorc / 100));
            const valorCuota = totalCobrar / numCuotas;

            let cronograma = [];
            for(let i = 1; i <= numCuotas; i++) {
                let fVenc = new Date(fManual);
                fVenc.setDate(fManual.getDate() + (i * diasFrecuencia));
                cronograma.push({
                    numero: i,
                    fechaVenc: fVenc.toISOString(),
                    montoTotal: valorCuota,
                    montoPagado: 0
                });
            }

            clientes.push({
                id: Date.now(),
                nombre: nombre.toUpperCase(),
                montoInicial: monto,
                totalCobrar: totalCobrar,
                cuotas: cronograma,
                fechaCreacion: fManual.toISOString()
            });

            guardar();
            document.getElementById('nombreCliente').value = '';
            document.getElementById('montoInput').value = '';
        }

        function registrarPago(clienteId) {
            const montoStr = prompt("Monto a abonar:");
            const montoAbonado = parseFloat(montoStr);
            if(isNaN(montoAbonado) || montoAbonado <= 0) return;

            let remanente = montoAbonado;
            const cIdx = clientes.findIndex(c => c.id === clienteId);
            let cliente = clientes[cIdx];

            for(let cuota of cliente.cuotas) {
                if(remanente <= 0) break;
                let falta = cuota.montoTotal - cuota.montoPagado;
                if(falta > 0) {
                    if(remanente >= falta) {
                        cuota.montoPagado = cuota.montoTotal;
                        remanente -= falta;
                    } else {
                        cuota.montoPagado += remanente;
                        remanente = 0;
                    }
                }
            }
            guardar();
            const msg = `*COMPROBANTE DE PAGO*%0A*EMPRESA:* PRZ PRESTAMOS%0A*CLIENTE:* ${cliente.nombre}%0A*ABONÓ:* $${montoAbonado.toLocaleString('es-AR')}%0A--------------------------`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        function abrirModal(id) {
            const c = clientes.find(x => x.id === id);
            document.getElementById('editId').value = c.id;
            document.getElementById('editNombre').value = c.nombre;
            document.getElementById('modalEdit').classList.remove('hidden');
        }
        function cerrarModal() { document.getElementById('modalEdit').classList.add('hidden'); }
        function guardarEdicion() {
            const id = parseInt(document.getElementById('editId').value);
            const index = clientes.findIndex(c => c.id === id);
            clientes[index].nombre = document.getElementById('editNombre').value.toUpperCase();
            guardar();
            cerrarModal();
        }

        function renderizar() {
            const lista = document.getElementById('listaClientes');
            lista.innerHTML = '';
            let capG = 0; let deuG = 0;
            const hoy = new Date();

            clientes.forEach(c => {
                capG += c.montoInicial;
                let saldoPendiente = 0;
                const cuotasHTML = c.cuotas.map(ct => {
                    const fV = new Date(ct.fechaVenc);
                    const vencida = hoy > fV && ct.montoPagado < (ct.montoTotal - 0.1);
                    saldoPendiente += (ct.montoTotal - ct.montoPagado);
                    let clase = ct.montoPagado >= (ct.montoTotal - 0.1) ? "cuota-pagada" : (vencida ? "cuota-vencida" : (ct.montoPagado > 0 ? "cuota-pendiente" : ""));
                    return `
                        <div class="cuota-card p-3 shadow-sm ${clase}">
                            <div class="flex justify-between items-center">
                                <div class="text-[10px]">
                                    <div class="font-black text-slate-800 uppercase">Cuota ${ct.numero}</div>
                                    <div class="text-slate-400 font-bold">${fV.toLocaleDateString('es-AR')}</div>
                                    <div class="text-slate-500 italic">Total: $${ct.montoTotal.toLocaleString('es-AR')}</div>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] font-bold text-slate-400 uppercase">Pagado</p>
                                    <p class="text-sm font-black text-emerald">$${ct.montoPagado.toLocaleString('es-AR')}</p>
                                </div>
                            </div>
                        </div>`;
                }).join('');
                deuG += saldoPendiente;

                const card = document.createElement('div');
                card.className = 'card-prz mb-4';
                card.innerHTML = `
                    <div class="p-4 flex justify-between items-center">
                        <div class="cursor-pointer" onclick="document.getElementById('plan-${c.id}').classList.toggle('hidden')">
                            <h3 class="font-black text-white text-sm uppercase">${c.nombre}</h3>
                            <p class="text-[10px] text-emerald font-bold">$${saldoPendiente.toLocaleString('es-AR')} pendiente</p>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="abrirModal(${c.id})" class="text-slate-500"><i class="fas fa-edit text-xs"></i></button>
                            <button onclick="eliminar(${c.id})" class="text-red-900"><i class="fas fa-trash-alt text-xs"></i></button>
                        </div>
                    </div>
                    <div id="plan-${c.id}" class="hidden p-3 bg-slate-900/50 border-t border-slate-700">
                        <button onclick="registrarPago(${c.id})" class="btn-emerald w-full py-2 text-xs mb-4 uppercase">Registrar Pago</button>
                        <div class="max-h-72 overflow-y-auto">${cuotasHTML}</div>
                    </div>`;
                lista.appendChild(card);
            });
            document.getElementById('totalCapital').innerText = `$${capG.toLocaleString('es-AR')}`;
            document.getElementById('totalDeuda').innerText = `$${deuG.toLocaleString('es-AR')}`;
        }

        function eliminar(id) { if(confirm("¿Borrar préstamo?")) { clientes = clientes.filter(c => c.id !== id); guardar(); } }
        function exportarDatos() {
            const blob = new Blob([JSON.stringify(clientes)], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `PRZ_BACKUP.json`; a.click();
        }
        function importarDatos(e) {
            const reader = new FileReader();
            reader.onload = (ev) => { clientes = JSON.parse(ev.target.result); guardar(); };
            reader.readAsText(e.target.files[0]);
        }
        renderizar();
    </script>
</body>
</html>
