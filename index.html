<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRESTAMOS PRO</title>
    <style>
        :root { --primary: #0a1f1c; --secondary: #122c28; --accent: #4caf50; --text: #e0e0e0; --card-bg: #ffffff10; --danger: #ff5252; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary); color: var(--text); margin: 0; padding-bottom: 80px; }
        .header { background: linear-gradient(to bottom, #1a3c37, var(--primary)); padding: 20px; text-align: center; border-bottom: 1px solid #ffffff10; }
        .container { padding: 15px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 15px; border-radius: 15px; border: 1px solid #ffffff10; text-align: center; }
        .stat-card span { display: block; font-size: 11px; opacity: 0.7; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card strong { font-size: 16px; color: var(--accent); }
        .search-box { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #ffffff20; background: #ffffff10; color: white; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; }
        .card-client { background: var(--card-bg); border-radius: 15px; padding: 15px; margin-bottom: 10px; border-left: 5px solid var(--accent); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .cuota-card { background: #fff; color: #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 6px solid #ccc; transition: 0.3s; }
        .cuota-card.pagada { border-left-color: var(--accent); opacity: 0.7; background: #e8f5e9; }
        .cuota-card.parcial { border-left-color: #ff9800; background: #fff3e0; }
        .cuota-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 8px; }
        .cuota-body { display: grid; grid-template-columns: 1fr 1fr; font-size: 13px; gap: 5px; }
        .label-c { color: #888; font-size: 11px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; padding: 20px; box-sizing: border-box; z-index: 100; overflow-y: auto; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #ffffff30; background: #000; color: white; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .btn-add { background: var(--accent); color: white; }
        .btn-cancel { background: transparent; color: #aaa; }
        .fab { position: fixed; bottom: 90px; right: 20px; background: var(--accent); width: 60px; height: 60px; border-radius: 50%; font-size: 30px; color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 10; }
    </style>
</head>
<body>

<div id="view-cartera">
    <div class="header"><h2>PRZ PRESTAMOS</h2></div>
    <div class="container">
        <div class="dashboard">
            <div class="stat-card"><span>En la Calle</span><strong id="dash-calle">$0</strong></div>
            <div class="stat-card"><span>Capital Invertido</span><strong id="dash-invest">$0</strong></div>
        </div>
        <input type="text" id="buscador" class="search-box" placeholder="🔍 Buscar cliente..." onkeyup="renderCartera()">
        <div id="lista-clientes"></div>
    </div>
    <button class="fab" onclick="abrirNuevo()">+</button>
</div>

<div id="view-detalle" style="display:none;">
    <div class="header">
        <button onclick="irHome()" style="float:left; background:none; border:none; color:white; font-size:24px;">←</button>
        <button onclick="eliminarPrestamo()" style="float:right; background:none; border:none; color:var(--danger); font-size:20px;">🗑️</button>
        <h3 id="det-nombre" style="margin:0">Cliente</h3>
        <small id="det-info" style="color:var(--accent)"></small>
    </div>
    <div class="container" id="lista-cuotas"></div>
    <div class="container"><button class="btn btn-add" onclick="abrirPago()">💵 REGISTRAR COBRO</button></div>
</div>

<div id="modal-nuevo" class="modal">
    <h3>Nuevo Crédito</h3>
    <input type="text" id="f-nombre" placeholder="Nombre del Cliente">
    <input type="text" id="f-capital" placeholder="Capital a Entregar ($)" oninput="handleInput(this)">
    <input type="number" id="f-tasa" placeholder="Interés Total (%)" oninput="calcularPreview()">
    <input type="number" id="f-cuotas" placeholder="Cantidad de Cuotas" oninput="calcularPreview()">
    <select id="f-frecuencia">
        <option value="Diario">Diario</option>
        <option value="Semanal" selected>Semanal</option>
        <option value="Quincenal">Quincenal</option>
        <option value="Mensual">Mensual</option>
    </select>
    <div style="background:#000; padding:15px; border-radius:10px; margin:10px 0;">
        <span style="font-size:12px; color:var(--accent)">RESUMEN:</span><br>
        <strong>Total a Cobrar: <span id="pre-total">$0</span></strong><br>
        <small>Valor Cuota: <span id="pre-cuota">$0</span></small>
    </div>
    <button class="btn btn-add" onclick="guardarPrestamo()">CREAR PRÉSTAMO</button>
    <button class="btn btn-cancel" onclick="cerrarModal('modal-nuevo')">CANCELAR</button>
</div>

<div id="modal-pago" class="modal">
    <h3>Registrar Pago</h3>
    <p id="p-info-cuota" style="font-size:14px; margin-bottom:5px;"></p>
    <input type="text" id="p-monto" placeholder="Monto a Cobrar ($)" oninput="handleInput(this)">
    <button class="btn btn-add" onclick="procesarPago()">CONFIRMAR Y WHATSAPP</button>
    <button class="btn btn-cancel" onclick="cerrarModal('modal-pago')">CANCELAR</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('prz_db_v3')) || [];
    let curIdx = null;

    // Función para poner puntos de mil mientras se escribe
    function handleInput(el) {
        let val = el.value.replace(/\D/g, "");
        el.value = val ? new Intl.NumberFormat('es-AR').format(val) : "";
        if(el.id !== 'p-monto') calcularPreview();
    }

    function cleanNum(str) { return parseFloat(str.toString().replace(/\./g, "")) || 0; }
    function save() { localStorage.setItem('prz_db_v3', JSON.stringify(db)); }

    function calcularPreview() {
        const cap = cleanNum(document.getElementById('f-capital').value);
        const tasa = parseFloat(document.getElementById('f-tasa').value) || 0;
        const n = parseInt(document.getElementById('f-cuotas').value) || 1;
        const total = cap + (cap * (tasa/100));
        document.getElementById('pre-total').innerText = "$" + Math.round(total).toLocaleString('es-AR');
        document.getElementById('pre-cuota').innerText = "$" + Math.round(total/n).toLocaleString('es-AR');
    }

    function guardarPrestamo() {
        const nombre = document.getElementById('f-nombre').value.toUpperCase();
        const capital = cleanNum(document.getElementById('f-capital').value);
        const tasa = parseFloat(document.getElementById('f-tasa').value) || 0;
        const n = parseInt(document.getElementById('f-cuotas').value);
        const freq = document.getElementById('f-frecuencia').value;

        if(!nombre || !capital || !n) return alert("Faltan datos");

        const totalInt = capital * (tasa/100);
        const totalCobrar = capital + totalInt;
        const valorCuota = totalCobrar / n;

        let plan = [];
        for(let i=1; i<=n; i++) {
            plan.push({ n: i, total: valorCuota, pagado: 0, estado: 'Pendiente' });
        }

        db.push({ nombre, capital, totalCobrar, saldo: totalCobrar, n, freq, plan });
        save();
        cerrarModal('modal-nuevo');
        renderCartera();
    }

    function renderCartera() {
        const q = document.getElementById('buscador').value.toLowerCase();
        const lista = document.getElementById('lista-clientes');
        let enCalle = 0, invest = 0;

        lista.innerHTML = "";
        db.forEach((p, idx) => {
            if(p.nombre.toLowerCase().includes(q)) {
                enCalle += p.saldo;
                invest += p.capital;
                lista.innerHTML += `
                <div class="card-client" onclick="verDetalle(${idx})">
                    <div><strong>${p.nombre}</strong><br><small>${p.freq} - ${p.n} cuotas</small></div>
                    <div style="text-align:right"><span style="color:var(--accent); font-weight:bold">$${Math.round(p.saldo).toLocaleString('es-AR')}</span></div>
                </div>`;
            }
        });
        document.getElementById('dash-calle').innerText = "$" + Math.round(enCalle).toLocaleString('es-AR');
        document.getElementById('dash-invest').innerText = "$" + Math.round(invest).toLocaleString('es-AR');
    }

    function verDetalle(i) {
        curIdx = i;
        const p = db[i];
        document.getElementById('det-nombre').innerText = p.nombre;
        document.getElementById('det-info').innerText = `${p.freq} | SALDO: $${Math.round(p.saldo).toLocaleString('es-AR')}`;
        
        const l = document.getElementById('lista-cuotas');
        l.innerHTML = p.plan.map(c => `
            <div class="cuota-card ${c.estado === 'Pagada' ? 'pagada' : (c.estado === 'Parcial' ? 'parcial' : '')}">
                <div class="cuota-header"><span>CUOTA ${c.n}</span><span>${c.estado}</span></div>
                <div class="cuota-body">
                    <div><span class="label-c">VALOR CUOTA:</span><br>$${Math.round(c.total).toLocaleString('es-AR')}</div>
                    <div><span class="label-c">ABONADO:</span><br>$${Math.round(c.pagado).toLocaleString('es-AR')}</div>
                    <div><span class="label-c">FALTA:</span><br><strong>$${Math.round(c.total - c.pagado).toLocaleString('es-AR')}</strong></div>
                </div>
            </div>
        `).join('');
        document.getElementById('view-cartera').style.display = 'none';
        document.getElementById('view-detalle').style.display = 'block';
    }

    function abrirPago() {
        const p = db[curIdx];
        const proxima = p.plan.find(c => c.estado !== 'Pagada');
        if(!proxima) return alert("Crédito pagado");
        document.getElementById('p-info-cuota').innerText = `Cobrando a: ${p.nombre}`;
        document.getElementById('p-monto').value = Math.round(proxima.total - proxima.pagado).toLocaleString('es-AR');
        document.getElementById('modal-pago').style.display = 'block';
    }

    function procesarPago() {
        const montoIngresado = cleanNum(document.getElementById('p-monto').value);
        if(!montoIngresado) return;
        let p = db[curIdx];
        let resto = montoIngresado;

        for(let c of p.plan) {
            if(resto <= 0) break;
            if(c.estado === 'Pagada') continue;
            let deudaCuota = c.total - c.pagado;
            if(resto >= deudaCuota) {
                resto -= deudaCuota;
                c.pagado = c.total;
                c.estado = 'Pagada';
            } else {
                c.pagado += resto;
                c.estado = 'Parcial';
                resto = 0;
            }
        }
        p.saldo -= montoIngresado;
        save();
        const msg = encodeURIComponent(`*PRZ PRESTAMOS*\n\nRecibo de Pago\nCliente: ${p.nombre}\nAbonó: $${montoIngresado.toLocaleString('es-AR')}\nSaldo Restante: $${Math.round(p.saldo).toLocaleString('es-AR')}`);
        window.open(`https://wa.me/?text=${msg}`);
        cerrarModal('modal-pago');
        verDetalle(curIdx);
    }

    function eliminarPrestamo() { if(confirm("¿Borrar préstamo?")) { db.splice(curIdx, 1); save(); irHome(); } }
    function irHome() { document.getElementById('view-detalle').style.display = 'none'; document.getElementById('view-cartera').style.display = 'block'; renderCartera(); }
    function abrirNuevo() { document.getElementById('modal-nuevo').style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    renderCartera();
</script>
</body>
</html>
