<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRÉSTAMOS - Cobros</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; max-width: 400px; margin: auto; }
        h2 { color: #58a6ff; text-align: center; }
        label { display: block; margin-top: 10px; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2ea043; }
        #comprobante { margin-top: 20px; padding: 15px; border: 1px dashed #8b949e; background-color: #0d1117; display: none; }
        .info-msg { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 13px; }
        .pendiente { background: #bb800926; color: #d29922; border: 1px solid #bb800966; }
        .excedente { background: #23863626; color: #3fb950; border: 1px solid #23863666; }
    </style>
</head>
<body>

<div class="card">
    <h2>PRZ PRÉSTAMOS</h2>
    <label>Cliente</label>
    <input type="text" id="cliente" placeholder="Nombre completo">
    
    <label>Número de Cuota</label>
    <input type="number" id="cuota" placeholder="Ej: 1">
    
    <label>Valor de Cuota ($)</label>
    <input type="number" id="valorCuota" placeholder="5000">
    
    <label>Monto que Abona ($)</label>
    <input type="number" id="montoAbonado" placeholder="0.00">

    <button onclick="procesarPago()">GENERAR COBRO</button>

    <div id="resultadoMsg" class="info-msg" style="display:none;"></div>

    <div id="comprobante">
        <center><strong>PRZ PRESTAMOS</strong></center><br>
        Cliente: <span id="resCliente"></span><br>
        Cuota N°: <span id="resCuota"></span><br>
        Monto Abonado: $<span id="resMonto"></span><br>
        <hr>
        <small><span id="resEstado"></span></small>
    </div>
</div>

<script>
    function procesarPago() {
        const cliente = document.getElementById('cliente').value;
        const cuota = document.getElementById('cuota').value;
        const valor = parseFloat(document.getElementById('valorCuota').value);
        const abona = parseFloat(document.getElementById('montoAbonado').value);
        
        if(!cliente || !valor || isNaN(abona)) {
            alert("Por favor completá los datos");
            return;
        }

        const dif = abona - valor;
        const msgDiv = document.getElementById('resultadoMsg');
        const comp = document.getElementById('comprobante');
        let estado = "";

        msgDiv.style.display = "block";
        comp.style.display = "block";

        if (dif === 0) {
            msgDiv.className = "info-msg excedente";
            msgDiv.innerText = "Cuota cancelada.";
            estado = "PAGO TOTAL";
        } else if (dif < 0) {
            msgDiv.className = "info-msg pendiente";
            msgDiv.innerText = "Saldo pendiente: $" + Math.abs(dif).toFixed(2);
            estado = "PAGO PARCIAL - Restan: $" + Math.abs(dif).toFixed(2);
        } else {
            msgDiv.className = "info-msg excedente";
            msgDiv.innerText = "Excedente a favor: $" + dif.toFixed(2);
            estado = "PAGO CON EXCEDENTE - A cuenta: $" + dif.toFixed(2);
        }

        document.getElementById('resCliente').innerText = cliente;
        document.getElementById('resCuota').innerText = cuota;
        document.getElementById('resMonto').innerText = abona.toFixed(2);
        document.getElementById('resEstado').innerText = estado;
    }
</script>

</body>
</html>
