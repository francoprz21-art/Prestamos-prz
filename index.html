<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRESTAMOS - Sistema Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .card-cliente { background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        .cuota-card { 
            background: #ffffff; color: #1e293b; border-radius: 8px; 
            margin-bottom: 8px; border-left: 5px solid #cbd5e1; 
        }
        .cuota-pagada { border-left-color: #10b981 !important; }
        .cuota-pendiente { border-left-color: #f59e0b !important; }
        .cuota-vencida { border-left-color: #ef4444 !important; }
        
        .input-prz { background: #1e293b; border: 1px solid #475569; color: white; border-radius: 8px; padding: 10px; width: 100%; }
        .btn-emerald { background: #10b981; color: white; font-weight: bold; border-radius: 8px; }
        .text-emerald { color: #10b981; }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black tracking-tighter">PRZ <span class="text-emerald">PRESTAMOS</span></h1>
            <button onclick="exportarDatos()" class="text-slate-400"><i class="fas fa-file-export"></i></button>
        </header>

        <div class="card-cliente p-4 mb-6">
            <input type="text" id="nombreCliente" placeholder="Nombre del Cliente" class="input-prz mb-2 uppercase text-sm">
            <div class="grid grid-cols-2 gap-2 mb-2">
                <input type="text" id="montoInput" oninput="formatearMoneda(this)" placeholder="Monto" class="input-prz text-emerald font-bold">
                <input type="number" id="tasaInteres" placeholder="Interés %" class="input-prz">
            </div>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <input type="number" id="cuotas" placeholder="Cuotas" class="input-prz">
                <select id="frecuencia" class="input-prz text-xs">
                    <option value="1">Diario</option>
                    <option value="7">Semanal</option>
                    <option value="15">Quincenal</option>
                    <option value="30">Mensual</option>
                </select>
            </div>
            <button onclick="crearPrestamo()" class="btn-emerald w-full py-2 text-sm uppercase tracking-widest">Crear Crédito</button>
        </div>

        <div id="listaClientes" class="space-y-4"></div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('prz_final_v4')) || [];

        function formatearMoneda(input) {
            let valor = input.value.replace(/\D/g, "");
            valor = new Intl.NumberFormat('es-AR').format(valor);
            input.value = valor === "0" ? "" : valor;
        }

        function limpiarPuntos(str) {
            return parseFloat(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0;
        }

        function guardar() {
            localStorage.setItem('prz_final_v4', JSON.stringify(clientes));
            renderizar();
        }

        function crearPrestamo() {
            const nombre = document.getElementById('nombreCliente').value;
            const monto = limpiarPuntos(document.getElementById('montoInput').value);
            const interesPorc = parseFloat(document.getElementById('tasaInteres').value) || 0;
            const numCuotas = parseInt(document.getElementById('cuotas').value) || 1;
            const dias = parseInt(document.getElementById('frecuencia').value);

            if(!nombre || monto <= 0) return alert("Faltan datos");

            const totalInteres = monto * (interesPorc / 100);
            const totalCobrar = monto + totalInteres;
            
            const capPorCuota = monto / numCuotas;
            const intPorCuota = totalInteres / numCuotas;
            const valorCuotaTotal = totalCobrar / numCuotas;

            let cronograma = [];
            let hoy = new Date();

            for(let i = 1; i <= numCuotas; i++) {
                let fVenc = new Date();
                fVenc.setDate(hoy.getDate() + (i * dias));
                cronograma.push({
                    n: i,
                    vence: fVenc.toISOString(),
                    cap: capPorCuota,
                    int: intPorCuota,
                    total: valorCuotaTotal,
                    pagado: 0
                });
            }

            clientes.push({
                id: Date.now(),
                nombre: nombre.toUpperCase(),
                montoCap: monto,
                montoTotal: totalCobrar,
                cuotas: cronograma
            });

            guardar();
            document.getElementById('nombreCliente').value = '';
            document.getElementById('montoInput').value = '';
        }

        function registrarAbono(cId) {
            const monto = parseFloat(prompt("Monto a abonar:"));
            if(isNaN(monto) || monto <= 0) return;

            let remanente = monto;
            const cIndex = clientes.findIndex(x => x.id === cId);
            let c = clientes[cIndex];

            for(let cuota of c.cuotas) {
                if(remanente <= 0) break;
                let falta = cuota.total - cuota.pagado;
                if(falta > 0) {
                    if(remanente >= falta) {
                        cuota.pagado = cuota.total;
                        remanente -= falta;
                    } else {
                        cuota.pagado += remanente;
                        remanente = 0;
                    }
                }
            }
            guardar();
            
            const msg = `*PRZ PRESTAMOS - RECIBO*%0A*Cliente:* ${c.nombre}%0A*Abonó:* $${monto.toLocaleString('es-AR')}%0A------------------%0A_Gracias por su pago._`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        function renderizar() {
            const lista = document.getElementById('listaClientes');
            lista.innerHTML = '';
            const hoy = new Date();

            clientes.forEach(c => {
                let saldoC = c.cuotas.reduce((acc, curr) => acc + (curr.total - curr.pagado), 0);
                
                const cuotasHTML = c.cuotas.map(ct => {
                    const fV = new Date(ct.vence);
                    const vencida = hoy > fV && ct.pagado < ct.total;
                    let estadoClase = "";
                    if(ct.pagado >= ct.total) estadoClase = "cuota-pagada";
                    else if(vencida) estadoClase = "cuota-vencida";
                    else if(ct.pagado > 0) estadoClase = "cuota-pendiente";

                    return `
                        <div class="cuota-card p-3 shadow-sm ${estadoClase}">
                            <div class="flex justify-between items-start">
                                <div class="text-[10px] space-y-1">
                                    <div class="flex gap-4">
                                        <span>Saldo capital: <b class="text-slate-600">$${(ct.cap - (ct.pagado > ct.cap ? ct.cap : ct.pagado)).toFixed(2)}</b></span>
                                        <span>Saldo interés: <b class="text-slate-600">$${(ct.int - (ct.pagado > ct.cap ? ct.pagado - ct.cap : 0)).toFixed(2)}</b></span>
                                    </div>
                                    <div class="font-bold text-slate-800">Saldo total: $${(ct.total - ct.pagado).toLocaleString('es-AR')}</div>
                                    <div class="text-slate-400">Vence: ${fV.toLocaleDateString('es-AR')}</div>
                                </div>
                                <div class="text-right">
                                    <span class="bg-slate-100 text-slate-500 text-[9px] px-2 py-1 rounded-full font-bold">${ct.n}</span>
                                    <p class="text-xs font-black mt-2">Abonado</p>
                                    <p class="text-sm font-bold text-emerald">$${ct.pagado.toLocaleString('es-AR')}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                const div = document.createElement('div');
                div.className = 'card-cliente';
                div.innerHTML = `
                    <div class="p-4 flex justify-between items-center cursor-pointer" onclick="document.getElementById('plan-${c.id}').classList.toggle('hidden')">
                        <div>
                            <h3 class="font-bold text-white uppercase text-sm">${c.nombre}</h3>
                            <p class="text-xs text-emerald font-bold">$${saldoC.toLocaleString('es-AR')} pendiente</p>
                        </div>
                        <i class="fas fa-chevron-down text-slate-500 text-xs"></i>
                    </div>
                    <div id="plan-${c.id}" class="hidden p-3 bg-slate-800/50 border-t border-slate-700">
                        <div class="flex justify-between mb-4">
                            <span class="text-[10px] font-bold text-slate-400 uppercase"><i class="fas fa-list-ol mr-1"></i> Plan de pago</span>
                            <button onclick="registrarAbono(${c.id})" class="text-emerald text-[10px] font-black uppercase"><i class="fas fa-plus-circle"></i> Abonar</button>
                        </div>
                        ${cuotasHTML}
                        <button onclick="eliminar(${c.id})" class="w-full mt-4 text-[9px] text-red-500 font-bold uppercase opacity-30">Eliminar Cliente</button>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        function eliminar(id) { if(confirm("¿Eliminar?")) { clientes = clientes.filter(x => x.id !== id); guardar(); } }
        function exportarDatos() {
            const blob = new Blob([JSON.stringify(clientes)], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = "PRZ_BACKUP.json"; a.click();
        }
        renderizar();
    </script>
</body>
</html>
