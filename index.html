<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRESTAMOS - Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #060a0f; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .card-prz { background: #111827; border: 1px solid #1f2937; border-radius: 12px; }
        .input-prz { 
            background: #1f2937; border: 1px solid #374151; color: white; 
            border-radius: 8px; padding: 12px; width: 100%;
        }
        .input-prz:focus { border-color: #10b981; outline: none; }
        .btn-emerald { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: white; font-weight: bold; border-radius: 8px; transition: all 0.3s;
        }
        .btn-emerald:hover { opacity: 0.9; transform: scale(0.98); }
        .text-emerald { color: #10b981; }
    </style>
</head>
<body class="p-4 pb-24">

    <div class="max-w-md mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-black tracking-widest text-white">PRZ <span class="text-emerald">PRESTAMOS</span></h1>
            <div class="h-1 w-20 bg-emerald-500 mx-auto mt-1 rounded-full"></div>
        </header>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="card-prz p-4 border-t-4 border-t-emerald-500">
                <p class="text-[10px] text-slate-400 uppercase font-bold">Capital Activo</p>
                <p id="totalCapital" class="text-xl font-bold text-white">$0</p>
            </div>
            <div class="card-prz p-4 border-t-4 border-t-emerald-500">
                <p class="text-[10px] text-slate-400 uppercase font-bold">Total a Cobrar</p>
                <p id="totalDeuda" class="text-xl font-bold text-emerald">$0</p>
            </div>
        </div>

        <div class="card-prz p-5 mb-6">
            <div class="space-y-4">
                <input type="text" id="nombreCliente" placeholder="Nombre del Cliente" class="input-prz uppercase">
                <div class="relative">
                    <input type="text" id="montoInput" oninput="formatearMoneda(this)" placeholder="Monto del préstamo" class="input-prz text-emerald font-bold text-lg">
                    <span class="absolute right-3 top-3 text-slate-500">$</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="tasaInteres" placeholder="Interés %" class="input-prz">
                    <input type="number" id="cuotas" placeholder="Cuotas" class="input-prz">
                </div>
                <select id="frecuencia" class="input-prz">
                    <option value="Diario">Diario</option>
                    <option value="Semanal">Semanal</option>
                    <option value="Quincenal">Quincenal</option>
                    <option value="Mensual">Mensual</option>
                </select>
                <button onclick="crearPrestamo()" class="btn-emerald w-full py-4 shadow-lg shadow-emerald-900/20">
                    GENERAR NUEVO CRÉDITO
                </button>
            </div>
        </div>

        <div id="listaClientes" class="space-y-4"></div>
    </div>

    <div class="fixed bottom-5 right-5 flex flex-col gap-3">
        <button onclick="exportarDatos()" class="bg-slate-800 p-4 rounded-full text-emerald shadow-xl border border-emerald-900/50"><i class="fas fa-download"></i></button>
        <button onclick="document.getElementById('importInput').click()" class="bg-slate-800 p-4 rounded-full text-slate-400 shadow-xl border border-slate-700"><i class="fas fa-upload"></i></button>
        <input type="file" id="importInput" class="hidden" onchange="importarDatos(event)">
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('prz_final_data')) || [];

        function formatearMoneda(input) {
            let valor = input.value.replace(/\D/g, "");
            valor = new Intl.NumberFormat('es-AR').format(valor);
            input.value = valor === "0" ? "" : valor;
        }

        function limpiarPuntos(str) {
            return parseFloat(str.replace(/\./g, '').replace(/,/g, '')) || 0;
        }

        function guardar() {
            localStorage.setItem('prz_final_data', JSON.stringify(clientes));
            renderizar();
        }

        function crearPrestamo() {
            const nombre = document.getElementById('nombreCliente').value;
            const monto = limpiarPuntos(document.getElementById('montoInput').value);
            const interes = parseFloat(document.getElementById('tasaInteres').value) || 0;
            const cuotas = parseInt(document.getElementById('cuotas').value) || 1;
            const frecuencia = document.getElementById('frecuencia').value;

            if(!nombre || monto <= 0) return alert("Carga nombre y monto");

            const total = monto + (monto * (interes / 100));
            const valorCuota = total / cuotas;

            clientes.push({
                id: Date.now(),
                nombre: nombre.toUpperCase(),
                montoInicial: monto,
                totalCobrar: total,
                saldoRestante: total,
                cuotasTotales: cuotas,
                cuotasPagas: 0,
                valorCuota,
                frecuencia,
                fecha: new Date().toLocaleDateString('es-AR')
            });

            guardar();
            document.getElementById('nombreCliente').value = '';
            document.getElementById('montoInput').value = '';
        }

        function registrarPago(id) {
            const i = clientes.findIndex(c => c.id === id);
            if(clientes[i].saldoRestante <= 0) return;

            clientes[i].cuotasPagas += 1;
            clientes[i].saldoRestante -= clientes[i].valorCuota;
            if(clientes[i].saldoRestante < 0) clientes[i].saldoRestante = 0;

            guardar();
            enviarWA(clientes[i]);
        }

        function enviarWA(c) {
            const msg = `*PRZ PRESTAMOS*%0A` +
                        `*Cliente:* ${c.nombre}%0A` +
                        `*Pago:* Cuota ${c.cuotasPagas}/${c.cuotasTotales}%0A` +
                        `*Monto:* $${c.valorCuota.toLocaleString('es-AR')}%0A` +
                        `--------------------------%0A` +
                        `*SALDO RESTANTE:* *$${c.saldoRestante.toLocaleString('es-AR')}*%0A` +
                        `--------------------------`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        function renderizar() {
            const lista = document.getElementById('listaClientes');
            lista.innerHTML = '';
            let cap = 0; let deu = 0;

            clientes.forEach(c => {
                cap += c.montoInicial;
                deu += c.saldoRestante;
                const card = document.createElement('div');
                card.className = 'card-prz p-4';
                card.innerHTML = `
                    <div class="flex justify-between mb-3">
                        <span class="font-black text-white text-sm">${c.nombre}</span>
                        <span class="text-emerald text-[10px] font-bold">${c.frecuencia}</span>
                    </div>
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <p class="text-[9px] text-slate-500 uppercase">Saldo</p>
                            <p class="text-xl font-bold text-white">$${c.saldoRestante.toLocaleString('es-AR')}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-slate-500 uppercase">Cuota</p>
                            <p class="text-sm font-bold text-slate-300">$${c.valorCuota.toLocaleString('es-AR')}</p>
                        </div>
                    </div>
                    <button onclick="registrarPago(${c.id})" class="w-full btn-emerald py-2 text-xs mb-2">COBRAR CUOTA ${c.cuotasPagas}/${c.cuotasTotales}</button>
                    <button onclick="eliminar(${c.id})" class="w-full text-slate-600 text-[10px] uppercase font-bold">Eliminar Registro</button>
                `;
                lista.appendChild(card);
            });
            document.getElementById('totalCapital').innerText = `$${cap.toLocaleString('es-AR')}`;
            document.getElementById('totalDeuda').innerText = `$${deu.toLocaleString('es-AR')}`;
        }

        function eliminar(id) { if(confirm("¿Borrar?")) { clientes = clientes.filter(c => c.id !== id); guardar(); } }
        function exportarDatos() {
            const blob = new Blob([JSON.stringify(clientes)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `PRZ_DATA.json`;
            a.click();
        }
        function importarDatos(e) {
            const reader = new FileReader();
            reader.onload = (ev) => { clientes = JSON.parse(ev.target.result); guardar(); };
            reader.readAsText(e.target.files[0]);
        }
        renderizar();
    </script>
</body>
</html>
