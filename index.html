<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRESTAMOS - Gestión Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e293b; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .input-prz { background: #334155; border: 1px solid #475569; color: white; border-radius: 8px; padding: 10px; width: 100%; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="max-w-md mx-auto mb-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-400">PRZ PRESTAMOS</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="card p-4 text-center">
                <p class="text-xs text-slate-400 uppercase">Capital Prestado</p>
                <p id="totalCapital" class="text-xl font-bold text-emerald-400">$0</p>
            </div>
            <div class="card p-4 text-center">
                <p class="text-xs text-slate-400 uppercase">Total a Cobrar</p>
                <p id="totalDeuda" class="text-xl font-bold text-blue-400">$0</p>
            </div>
        </div>

        <div class="card p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4 border-b border-slate-700 pb-2">Nuevo Préstamo</h2>
            <div class="space-y-4">
                <input type="text" id="nombreCliente" placeholder="Nombre del Cliente" class="input-prz">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="montoPrestamo" placeholder="Monto ($)" class="input-prz">
                    <input type="number" id="tasaInteres" placeholder="Interés (%)" class="input-prz">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="cuotas" placeholder="N° Cuotas" class="input-prz">
                    <select id="frecuencia" class="input-prz">
                        <option value="diario">Diario</option>
                        <option value="semanal">Semanal</option>
                        <option value="quincenal">Quincenal</option>
                        <option value="mensual">Mensual</option>
                    </select>
                </div>
                <button onclick="crearPrestamo()" class="btn-primary w-full py-3 rounded-lg font-bold text-white uppercase tracking-wider">
                    Generar Préstamo
                </button>
            </div>
        </div>

        <div class="relative mb-4">
            <input type="text" id="buscador" onkeyup="filtrarClientes()" placeholder="Buscar cliente..." class="input-prz pl-10">
            <i class="fas fa-search absolute left-3 top-3.5 text-slate-400"></i>
        </div>

        <div id="listaClientes" class="space-y-4">
            </div>
    </div>

    <div class="fixed bottom-4 right-4 flex flex-col gap-2">
        <button onclick="exportarDatos()" class="bg-slate-700 p-3 rounded-full text-white shadow-lg"><i class="fas fa-file-export"></i></button>
        <button onclick="document.getElementById('importInput').click()" class="bg-slate-700 p-3 rounded-full text-white shadow-lg"><i class="fas fa-file-import"></i></button>
        <input type="file" id="importInput" class="hidden" onchange="importarDatos(event)">
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('prz_data')) || [];

        function guardar() {
            localStorage.setItem('prz_data', JSON.stringify(clientes));
            renderizar();
        }

        function crearPrestamo() {
            const nombre = document.getElementById('nombreCliente').value;
            const monto = parseFloat(document.getElementById('montoPrestamo').value);
            const interes = parseFloat(document.getElementById('tasaInteres').value);
            const cuotas = parseInt(document.getElementById('cuotas').value);
            const frecuencia = document.getElementById('frecuencia').value;

            if(!nombre || !monto) return alert("Completa los datos básicos");

            const totalCobrar = monto + (monto * (interes / 100));
            const valorCuota = totalCobrar / cuotas;

            const nuevoCliente = {
                id: Date.now(),
                nombre,
                montoInicial: monto,
                totalCobrar,
                saldoRestante: totalCobrar,
                cuotasTotales: cuotas,
                cuotasPagas: 0,
                valorCuota,
                frecuencia,
                fechaInicio: new Date().toLocaleDateString(),
                pagos: []
            };

            clientes.push(nuevoCliente);
            guardar();
            limpiarFormulario();
        }

        function registrarPago(idCliente) {
            const index = clientes.findIndex(c => c.id === idCliente);
            if(clientes[index].saldoRestante <= 0) return alert("Préstamo ya finalizado");

            clientes[index].cuotasPagas += 1;
            clientes[index].saldoRestante -= clientes[index].valorCuota;
            
            // Registro del pago para el historial
            clientes[index].pagos.push({
                fecha: new Date().toLocaleString(),
                monto: clientes[index].valorCuota
            });

            guardar();
            enviarWhatsApp(clientes[index]);
        }

        function enviarWhatsApp(cliente) {
            const mensaje = `*PRZ PRESTAMOS*%0A` +
                            `Hola ${cliente.nombre}, se registró tu pago.%0A` +
                            `--------------------------%0A` +
                            `Cuota: ${cliente.cuotasPagas}/${cliente.cuotasTotales}%0A` +
                            `Monto pagado: $${cliente.valorCuota.toFixed(2)}%0A` +
                            `Saldo Restante: *$${cliente.saldoRestante.toFixed(2)}*%0A` +
                            `--------------------------%0A` +
                            `Gracias por tu puntualidad.`;
            window.open(`https://wa.me/?text=${mensaje}`, '_blank');
        }

        function renderizar() {
            const contenedor = document.getElementById('listaClientes');
            contenedor.innerHTML = '';
            let totalCap = 0;
            let totalDeu = 0;

            clientes.forEach(c => {
                totalCap += c.montoInicial;
                totalDeu += c.saldoRestante;

                const card = document.createElement('div');
                card.className = 'card p-4 border-l-4 ' + (c.saldoRestante <= 0 ? 'border-emerald-500' : 'border-blue-500');
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-lg">${c.nombre}</h3>
                            <p class="text-xs text-slate-400">${c.fechaInicio} | ${c.frecuencia}</p>
                        </div>
                        <button onclick="eliminarCliente(${c.id})" class="text-red-400 text-xs"><i class="fas fa-trash"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-sm mb-4">
                        <p>Cuotas: <span class="text-white">${c.cuotasPagas}/${c.cuotasTotales}</span></p>
                        <p class="text-right">Saldo: <span class="text-blue-300">$${c.saldoRestante.toFixed(2)}</span></p>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-1.5 mb-4">
                        <div class="bg-blue-500 h-1.5 rounded-full" style="width: ${(c.cuotasPagas/c.cuotasTotales)*100}%"></div>
                    </div>
                    <button onclick="registrarPago(${c.id})" class="w-full bg-slate-600 hover:bg-slate-500 py-2 rounded font-semibold text-sm transition">
                        Registrar Pago y Enviar Recibo
                    </button>
                `;
                contenedor.appendChild(card);
            });

            document.getElementById('totalCapital').innerText = `$${totalCap.toLocaleString()}`;
            document.getElementById('totalDeuda').innerText = `$${totalDeu.toLocaleString()}`;
        }

        function eliminarCliente(id) {
            if(confirm("¿Eliminar este registro?")) {
                clientes = clientes.filter(c => c.id !== id);
                guardar();
            }
        }

        function filtrarClientes() {
            const busqueda = document.getElementById('buscador').value.toLowerCase();
            const cards = document.getElementById('listaClientes').children;
            for(let card of cards) {
                const nombre = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = nombre.includes(busqueda) ? 'block' : 'none';
            }
        }

        function exportarDatos() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clientes));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "prz_backup.json");
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importarDatos(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                clientes = JSON.parse(e.target.result);
                guardar();
            };
            reader.readAsText(event.target.files[0]);
        }

        function limpiarFormulario() {
            document.getElementById('nombreCliente').value = '';
            document.getElementById('montoPrestamo').value = '';
            document.getElementById('tasaInteres').value = '';
            document.getElementById('cuotas').value = '';
        }

        // Carga inicial
        renderizar();
    </script>
</body>
</html>
