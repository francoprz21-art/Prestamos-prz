<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ SISTEMA DE GESTIÓN</title>
    <style>
        :root { --bg: #0d1b1a; --card: #162d2a; --accent: #4caf50; --text: #f0f0f0; --danger: #ff5252; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #1a3c37, var(--bg)); padding: 25px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .container { padding: 15px; }
        
        /* Dashboard */
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #ffffff10; text-align: center; }
        .stat-card small { font-size: 10px; text-transform: uppercase; opacity: 0.6; display: block; }
        .stat-card b { font-size: 18px; color: var(--accent); }

        /* Buscador */
        .search-bar { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #00000030; color: white; margin-bottom: 15px; box-sizing: border-box; }

        /* Lista de Clientes */
        .client-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--accent); cursor: pointer; }
        .client-info b { font-size: 16px; display: block; }
        .client-info span { font-size: 12px; opacity: 0.7; }

        /* Modales */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 100; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { max-width: 500px; margin: auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        label { font-size: 12px; color: var(--accent); margin-top: 10px; display: block; }

        /* Botones */
        .btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-main { background: var(--accent); color: white; }
        .btn-sec { background: transparent; color: white; border: 1px solid #555; }
        .btn-danger { background: var(--danger); color: white; }
        .fab { position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: none; color: white; }

        /* Cuotas */
        .cuota-row { background: white; color: #333; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .cuota-row.pagada { border-left: 5px solid var(--accent); opacity: 0.7; }
        
        .nav { position: fixed; bottom: 0; width: 100%; background: #050a0a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
    </style>
</head>
<body>

<div id="view-home">
    <div class="header"><h1>PRZ PRÉSTAMOS</h1></div>
    <div class="container">
        <div class="stats">
            <div class="stat-card"><small>Total en Calle</small><b id="stat-calle">$0</b></div>
            <div class="stat-card"><small>Capital Invertido</small><b id="stat-invest">$0</b></div>
        </div>
        <input type="text" id="search" class="search-bar" placeholder="🔍 Buscar cliente..." onkeyup="renderClients()">
        <div id="client-list"></div>
    </div>
    <button class="fab" onclick="openNewLoan()">+</button>
</div>

<div id="view-detail" style="display:none;">
    <div class="header">
        <button onclick="showHome()" style="float:left; background:none; border:none; color:white; font-size:20px;">←</button>
        <button onclick="editClient()" style="float:right; background:none; border:none; color:white; font-size:20px;">✏️</button>
        <h2 id="det-name" style="margin:0">Cliente</h2>
        <small id="det-status" style="color:var(--accent)"></small>
    </div>
    <div class="container">
        <div id="installments-list"></div>
        <button class="btn btn-main" onclick="openPayment()">💰 REGISTRAR COBRO</button>
    </div>
</div>

<div id="modal-form" class="modal">
    <div class="modal-content">
        <h2 id="form-title">Nuevo Préstamo</h2>
        <label>NOMBRE DEL CLIENTE</label>
        <input type="text" id="f-name" placeholder="Ej: Juan Pérez">
        
        <label>CAPITAL A ENTREGAR ($)</label>
        <input type="number" id="f-amount" placeholder="0.00" oninput="autoCalculate()">
        
        <label>INTERÉS (%)</label>
        <input type="number" id="f-interest" placeholder="Ej: 20" oninput="autoCalculate()">
        
        <div style="background: #000; padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center;">
            <small>TOTAL A COBRAR:</small><br>
            <strong id="f-total" style="font-size: 20px; color: var(--accent);">$0</strong>
        </div>

        <label>CANTIDAD DE CUOTAS</label>
        <input type="number" id="f-count" placeholder="Ej: 10">

        <label>FRECUENCIA DE PAGO</label>
        <select id="f-freq">
            <option value="Diario">Diario</option>
            <option value="Semanal">Semanal</option>
            <option value="Quincenal">Quincenal</option>
            <option value="Mensual">Mensual</option>
        </select>

        <button class="btn btn-main" onclick="saveLoan()">✅ GUARDAR</button>
        <button id="btn-del" class="btn btn-danger" style="display:none;" onclick="deleteLoan()">🗑️ ELIMINAR</button>
        <button class="btn btn-sec" onclick="closeModal('modal-form')">CANCELAR</button>
    </div>
</div>

<div id="modal-pay" class="modal">
    <div class="modal-content">
        <h2>Registrar Pago</h2>
        <label>MONTO RECIBIDO ($)</label>
        <input type="number" id="p-amount">
        <button class="btn btn-main" onclick="confirmPayment()">💾 CONFIRMAR Y WHATSAPP</button>
        <button class="btn btn-sec" onclick="closeModal('modal-pay')">CERRAR</button>
    </div>
</div>

<nav class="nav">
    <div onclick="showHome()">👥 Clientes</div>
    <div onclick="alert('Próximamente: Reportes')">📊 Resumen</div>
    <div onclick="exportData()">⚙️ Backup</div>
</nav>

<script>
    let loans = JSON.parse(localStorage.getItem('prz_data')) || [];
    let currentIdx = null;

    function save() { localStorage.setItem('prz_data', JSON.stringify(loans)); }

    function showHome() {
        document.getElementById('view-home').style.display = 'block';
        document.getElementById('view-detail').style.display = 'none';
        renderClients();
    }

    function openNewLoan() {
        currentIdx = null;
        document.getElementById('form-title').innerText = "Nuevo Préstamo";
        document.getElementById('btn-del').style.display = 'none';
        ['f-name','f-amount','f-interest','f-count'].forEach(id => document.getElementById(id).value = "");
        document.getElementById('f-total').innerText = "$0";
        document.getElementById('modal-form').style.display = 'block';
    }

    function autoCalculate() {
        const amt = parseFloat(document.getElementById('f-amount').value) || 0;
        const int = parseFloat(document.getElementById('f-interest').value) || 0;
        const total = amt + (amt * (int / 100));
        document.getElementById('f-total').innerText = "$" + total.toLocaleString();
    }

    function saveLoan() {
        const name = document.getElementById('f-name').value;
        const capital = parseFloat(document.getElementById('f-amount').value);
        const interest = parseFloat(document.getElementById('f-interest').value);
        const count = parseInt(document.getElementById('f-count').value);
        const freq = document.getElementById('f-freq').value;

        if(!name || !capital || !count) return alert("Completá los campos");

        const total = capital + (capital * (interest / 100));
        const cuotaVal = total / count;

        if (currentIdx !== null) {
            // Editar existente (solo nombre en esta versión simple para no romper el plan de pagos)
            loans[currentIdx].name = name;
        } else {
            // Nuevo
            let plan = [];
            for(let i=1; i<=count; i++) plan.push({ n: i, val: cuotaVal, paid: false });
            loans.push({ name, capital, total, balance: total, count, freq, plan, date: new Date().toLocaleDateString() });
        }

        save();
        closeModal('modal-form');
        renderClients();
    }

    function renderClients() {
        const query = document.getElementById('search').value.toLowerCase();
        const list = document.getElementById('client-list');
        let calle = 0, invest = 0;
        
        list.innerHTML = "";
        loans.forEach((l, idx) => {
            if(l.name.toLowerCase().includes(query)) {
                calle += l.balance;
                invest += l.capital;
                list.innerHTML += `
                    <div class="client-card" onclick="viewLoan(${idx})">
                        <div class="client-info">
                            <b>${l.name}</b>
                            <span>Saldo: $${l.balance.toLocaleString()} | ${l.freq}</span>
                        </div>
                        <div style="font-weight:bold; color:${l.balance <= 0 ? 'var(--accent)' : 'white'}">
                            ${l.balance <= 0 ? 'PAGADO' : '$' + Math.round(l.balance)}
                        </div>
                    </div>`;
            }
        });
        document.getElementById('stat-calle').innerText = "$" + Math.round(calle).toLocaleString();
        document.getElementById('stat-invest').innerText = "$" + Math.round(invest).toLocaleString();
    }

    function viewLoan(idx) {
        currentIdx = idx;
        const l = loans[idx];
        document.getElementById('det-name').innerText = l.name;
        document.getElementById('det-status').innerText = `SALDO PENDIENTE: $${l.balance.toLocaleString()}`;
        
        const iList = document.getElementById('installments-list');
        iList.innerHTML = l.plan.map(c => `
            <div class="cuota-row ${c.paid ? 'pagada' : ''}">
                <span>Cuota ${c.n}</span>
                <strong>$${c.val.toLocaleString()}</strong>
                <span>${c.paid ? '✅' : '⏳'}</span>
            </div>
        `).join('');

        document.getElementById('view-home').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
    }

    function openPayment() { document.getElementById('modal-pay').style.display = 'block'; }

    function confirmPayment() {
        const amt = parseFloat(document.getElementById('p-amount').value);
        if(!amt) return;
        
        let l = loans[currentIdx];
        l.balance -= amt;
        
        // Marcar cuotas como pagadas lógicamente
        let temp = amt;
        for(let c of l.plan) {
            if(!c.paid && temp >= c.val) {
                c.paid = true;
                temp -= c.val;
            }
        }
        
        save();
        const msg = encodeURIComponent(`*RECIBO DE PAGO - PRZ*\nCliente: ${l.name}\nAbonó: $${amt}\nSaldo restante: $${l.balance}`);
        window.open(`https://wa.me/?text=${msg}`);
        closeModal('modal-pay');
        viewLoan(currentIdx);
    }

    function deleteLoan() {
        if(confirm("¿Borrar préstamo?")) {
            loans.splice(currentIdx, 1);
            save();
            closeModal('modal-form');
            showHome();
        }
    }

    function editClient() {
        const l = loans[currentIdx];
        document.getElementById('f-name').value = l.name;
        document.getElementById('f-amount').value = l.capital;
        document.getElementById('f-interest').value = ((l.total/l.capital)-1)*100;
        document.getElementById('f-count').value = l.count;
        document.getElementById('btn-del').style.display = 'block';
        document.getElementById('modal-form').style.display = 'block';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(loans));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "prz_backup.json");
        downloadAnchorNode.click();
    }

    renderClients();
</script>
</body>
</html>
