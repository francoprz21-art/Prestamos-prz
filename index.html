<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestamos PRZ - Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-shadow { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .progress-bar { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center text-blue-700">💰 CobrosApp</h1>

        <div class="bg-white p-6 rounded-2xl card-shadow">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Registrar Nuevo Préstamo</h2>
            <div class="space-y-3">
                <input id="cliente" type="text" placeholder="Nombre del cliente" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                <input id="monto" type="number" placeholder="Monto total ($)" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex gap-2">
                    <select id="frecuencia" class="p-3 border rounded-xl bg-white w-1/2">
                        <option value="Diario">Diario</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Quincenal">Quincenal</option>
                        <option value="Mensual">Mensual</option>
                    </select>
                    <input id="cuotasTotal" type="number" placeholder="Cant. Cuotas" class="w-1/2 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="guardarPrestamo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
                    + Crear Préstamo
                </button>
            </div>
        </div>

        <div id="listaPrestamos" class="space-y-4 pb-10">
            </div>
    </div>

    <script>
        // Cargar datos al iniciar
        let prestamos = JSON.parse(localStorage.getItem('datos_prestamos')) || [];

        function guardarPrestamo() {
            const cliente = document.getElementById('cliente').value;
            const monto = parseFloat(document.getElementById('monto').value);
            const cuotasTotal = parseInt(document.getElementById('cuotasTotal').value);
            const frecuencia = document.getElementById('frecuencia').value;

            if (!cliente || isNaN(monto) || isNaN(cuotasTotal)) {
                return alert("Por favor, completa los datos básicos.");
            }

            const nuevoPrestamo = {
                id: Date.now(),
                cliente,
                monto,
                frecuencia,
                cuotasTotal,
                cuotasPagas: 0
            };

            prestamos.push(nuevoPrestamo);
            localStorage.setItem('datos_prestamos', JSON.stringify(prestamos));
            
            // Limpiar campos
            document.getElementById('cliente').value = '';
            document.getElementById('monto').value = '';
            document.getElementById('cuotasTotal').value = '';
            
            renderizarPrestamos();
        }

        function cobrarCuota(id) {
            const p = prestamos.find(x => x.id === id);
            if (p.cuotasPagas < p.cuotasTotal) {
                p.cuotasPagas++;
                localStorage.setItem('datos_prestamos', JSON.stringify(prestamos));
                renderizarPrestamos();
            }
        }

        function enviarWhatsApp(id) {
            const p = prestamos.find(x => x.id === id);
            const mensaje = `*CobrosApp - Comprobante*\n\nHola ${p.cliente}, se registró tu pago.\nEstado: ${p.cuotasPagas}/${p.cuotasTotal} cuotas.\nFrecuencia: ${p.frecuencia}.`;
            window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`);
        }

        function eliminarPrestamo(id) {
            if(confirm("¿Seguro que querés borrar este préstamo?")) {
                prestamos = prestamos.filter(p => p.id !== id);
                localStorage.setItem('datos_prestamos', JSON.stringify(prestamos));
                renderizarPrestamos();
            }
        }

        function renderizarPrestamos() {
            const contenedor = document.getElementById('listaPrestamos');
            contenedor.innerHTML = '';

            prestamos.forEach(p => {
                const porcentaje = (p.cuotasPagas / p.cuotasTotal) * 100;
                
                contenedor.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl card-shadow border-l-8 border-blue-500">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-xl">${p.cliente}</h3>
                                <p class="text-gray-500 text-sm">$${p.monto} - ${p.frecuencia}</p>
                            </div>
                            <button onclick="eliminarPrestamo(${p.id})" class="text-red-400 text-xs">Eliminar</button>
                        </div>

                        <div class="mt-4">
                            <div class="flex justify-between text-sm mb-1">
                                <span>Progreso: ${p.cuotasPagas}/${p.cuotasTotal} cuotas</span>
                                <span>${Math.round(porcentaje)}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3">
                                <div class="bg-green-500 h-3 rounded-full progress-bar" style="width: ${porcentaje}%"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-4">
                            <button onclick="cobrarCuota(${p.id})" class="bg-blue-100 text-blue-700 py-2 rounded-lg font-semibold hover:bg-blue-200">
                                💳 Cobrar
                            </button>
                            <button onclick="enviarWhatsApp(${p.id})" class="bg-green-500 text-white py-2 rounded-lg font-semibold hover:bg-green-600">
                                📱 WhatsApp
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Mostrar lo que ya existe
        renderizarPrestamos();
    </script>
</body>
</html>
