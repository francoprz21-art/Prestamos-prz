<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRZ PRÉSTAMOS</title>
    <style>
        :root { --primary: #0a2e29; --secondary: #164a41; --accent: #4caf50; --text: #e0e0e0; --card-bg: #ffffff10; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary); color: var(--text); margin: 0; padding-bottom: 80px; }
        .header { background: linear-gradient(to bottom, #10403a, var(--primary)); padding: 25px 20px; text-align: center; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .container { padding: 15px; }
        .card-prestamo { background: var(--card-bg); border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #ffffff15; cursor: pointer; transition: 0.3s; }
        .card-prestamo:active { transform: scale(0.98); background: #ffffff20; }
        .cuota-item { background: white; color: #333; margin-bottom: 8px; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nro-cuota { background: #e8f5e9; color: #2e7d32; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-right: 12px; font-weight: bold; border: 1px solid #c8e6c9; }
        .tab-menu { display: flex; background: var(--secondary); border-radius: 12px; margin-bottom: 20px; padding: 5px; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; border-radius: 8px; cursor: pointer; }
        .tab.active { background: var(--accent); color: white; font-weight: bold; }
        .btn-float { position: fixed; bottom: 90px; right: 20px; background: var(--accent); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 12px rgba(0,0,0,0.4); border: none; font-size: 28px; color: white; cursor: pointer; z-index: 10; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: #051a17; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #ffffff10; z-index: 5; }
        input { width: 100%; padding: 14px; margin-top: 10px; border-radius: 10px; border: 1px solid #ffffff30; background: #0d1117; color: white; box-sizing: border-box; font-size: 16px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; padding: 30px 20px; box-sizing: border-box; z-index: 100; overflow-y: auto; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .pago-parcial { color: #ffb74d; }
        .pago-adelanto { color: #81c784; }
    </style>
</head>
<body>

<div id="app">
    <div id="view-cartera">
        <div class="header">
            <h1 style="margin:0; font-size: 24px; letter-spacing: 1px;">PRZ PRÉSTAMOS</h1>
            <p style="margin:5px 0 0; opacity: 0.7; font-size: 14px;">Gestión de Cobros Efectiva</p>
        </div>
        <div class="container">
            <h3 style="color: var(--accent); margin-bottom: 15px;">Clientes Activos</h3>
            <div id="lista-clientes"></div>
        </div>
    </div>

    <div id="view-detalle" style="display:none;">
        <div class="header" style="text-align: left; position: relative;">
            <button onclick="changeView('view-cartera')" style="background:none; border:none; color:white; font-size: 24px; cursor:pointer;">←</button>
            <h2 id="det-nombre" style="margin: 10px 0 5px;">Nombre</h2>
            <p id="det-saldo" style="margin:0; color: var(--accent); font-weight: bold;"></p>
        </div>
        <div class="container">
            <div class="tab-menu">
                <div class="tab active">Plan de pago</div>
                <div class="tab" onclick="alert('Historial en desarrollo')">Historial</div>
            </div>
            <div id="lista-cuotas"></div>
        </div>
        <button class="btn-float" onclick="abrirModal('modal-pago')">💵</button>
    </div>

    <div id="modal-nuevo" class="modal">
        <h2 style="color:var(--accent)">Nuevo Préstamo</h2>
        <input type="text" id="n-cliente" placeholder="Nombre completo del cliente">
        <input type="number" id="n-valor" placeholder="Monto a entregar ($)">
        <input type="number" id="n-cuotas" placeholder="Cantidad de cuotas">
        <input type="number" id="n-interes" placeholder="Interés total (%)">
        <button class="btn-float" style="bottom:30px; right:30px;" onclick="guardarPrestamo()">✅</button>
        <button onclick="cerrarModal('modal-nuevo')" style="background:none; border:none; color:var(--text); width:100%; margin-top:30px; opacity: 0.5;">Cerrar sin guardar</button>
    </div>

    <div id="modal-pago" class="modal">
        <h2 style="color:var(--accent)">Registrar Cobro</h2>
        <p id="pago-info-cuota" style="margin-bottom:20px;"></p>
        <label style="font-size: 14px; opacity: 0.7;">Monto recibido:</label>
        <input type="number" id="pago-monto" placeholder="Ej: 5000">
        <button class="btn-float" style="bottom:30px; right:30px;" onclick="procesarAbono()">💾</button>
        <button onclick="cerrarModal('modal-pago')" style="background:none; border:none; color:var(--text); width:100%; margin-top:30px; opacity: 0.5;">Cancelar</button>
    </div>

    <div class="nav-bottom">
        <div onclick="changeView('view-cartera')" style="font-size: 20px;">👥</div>
        <div onclick="abrirModal('modal-nuevo')" style="font-size: 24px; background: var(--accent); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -25px; border: 4px solid var(--primary);">＋</div>
        <div onclick="alert('Configuración')" style="font-size: 20px;">⚙️</div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('prz_db')) || [];
    let curIdx = null;

    function changeView(id) {
        document.getElementById('view-cartera').style.display = 'none';
        document.getElementById('view-detalle').style.display = 'none';
        document.getElementById(id).style.display = 'block';
        if(id === 'view-cartera') renderCartera();
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

    function guardarPrestamo() {
        const nombre = document.getElementById('n-cliente').value;
        const valor = parseFloat(document.getElementById('n-valor').value);
        const nCuotas = parseInt(document.getElementById('n-cuotas').value);
        const int = parseFloat(document.getElementById('n-interes').value);

        if(!nombre || isNaN(valor) || isNaN(nCuotas)) return alert("Completar datos mínimos");

        const total = valor + (valor * (int/100));
        db.push({
            nombre: nombre.toUpperCase(),
            valor, nCuotas, total,
            cuotaVal: total / nCuotas,
            saldo: total
        });

        localStorage.setItem('prz_db', JSON.stringify(db));
        cerrarModal('modal-nuevo');
        renderCartera();
    }

    function renderCartera() {
        const cont = document.getElementById('lista-clientes');
        cont.innerHTML = db.length ? '' : '<p style="text-align:center; opacity:0.5; margin-top:50px;">No hay clientes registrados.<br>Toca el botón (+) para empezar.</p>';
        db.forEach((p, i) => {
            cont.innerHTML += `
                <div class="card-prestamo" onclick="verDetalle(${i})">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>${p.nombre}</strong>
                        <span style="color:var(--accent); font-weight:bold;">$${Math.round(p.saldo).toLocaleString()}</span>
                    </div>
                    <div style="margin-top:8px; font-size:12px; opacity:0.7;">
                        Original: $${Math.round(p.total).toLocaleString()} | ${p.nCuotas} cuotas
                    </div>
                </div>`;
        });
    }

    function verDetalle(i) {
        curIdx = i;
        const p = db[i];
        document.getElementById('det-nombre').innerText = p.nombre;
        document.getElementById('det-saldo').innerText = `SALDO PENDIENTE: $${p.saldo.toLocaleString()}`;
        document.getElementById('pago-info-cuota').innerText = `Valor de la cuota: $${p.cuotaVal.toLocaleString()}`;
        
        const listC = document.getElementById('lista-cuotas');
        listC.innerHTML = '';
        for(let n=1; n<=p.nCuotas; n++) {
            listC.innerHTML += `
                <div class="cuota-item">
                    <div style="display:flex; align-items:center;">
                        <div class="nro-cuota">${n}</div>
                        <div>
                            <div style="font-size:14px; font-weight:bold;">Cuota de capital</div>
                            <div style="font-size:11px; color:#666;">Estado: Pendiente</div>
                        </div>
                    </div>
                    <strong style="color:#2e7d32;">$${p.cuotaVal.toLocaleString()}</strong>
                </div>`;
        }
        changeView('view-detail');
    }

    function procesarAbono() {
        const monto = parseFloat(document.getElementById('pago-monto').value);
        if(!monto || isNaN(monto)) return alert("Ingresa un monto válido");
        
        const p = db[curIdx];
        const dif = monto - p.cuotaVal;
        p.saldo -= monto;
        
        let feedback = "";
        if (dif === 0) feedback = "Pago exacto registrado.";
        else if (dif < 0) feedback = "Pago parcial. Restan $" + Math.abs(dif).toFixed(2) + " de esta cuota.";
        else feedback = "¡Adelanto registrado! Se descontaron $" + dif.toFixed(2) + " de la deuda total.";

        localStorage.setItem('prz_db', JSON.stringify(db));
        alert(feedback);
        document.getElementById('pago-monto').value = "";
        cerrarModal('modal-pago');
        verDetalle(curIdx);
    }

    renderCartera();
</script>
</body>
</html>
